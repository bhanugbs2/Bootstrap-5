<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUTTERS LAYOUT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" 
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="text-success text-center">
        <h1 class="text-success">
            GBS TECH
        </h1>
        <strong>Bootstrap 5 Layout Gutters</strong>
    </div>
    <div class="container text-center">
        <div class="row gx-5">
            <div class="col-6">
                <div class="p-4 border text-white bg-danger">
                    column 1
                </div>
            </div>
            <div class="col-6">
                <div class="p-4 border text-white bg-success">
                    column 2
                </div>
            </div>
            <div class="row mt-3 gx-2">
                <div class="col-4">
                    <div class="p-4 border text-white bg-info">
                        column 1
                    </div>
                </div>
                <div class="col-4">
                    <div class="p-4 border text-bg-dark">
                        column 2
                    </div>
                </div>
                <div class="col-4">
                    <div class="p-4 border bg-warning">
                        column 3
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
