<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex Bootstrap 5 Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container text-center mt-5">
        <h2>
            Welcome To
            <span class="text-success">
                GBS TECH
            </span>
        </h2>
        <p>
            Default code has been loaded into the editor.
        </p>
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <img src="bootstrap.png" alt="img-1" class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Bootstrap 5</h5>
                        <p class="card-text">
                            Bootstrap is a widely-used open-source front-end framework for web development.
                        </p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <img src="GBSTECHLOGO.jpg" alt="img-2" class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">
                            GBS-TECH
                        </h5>
                        <p class="card-text">
                            A computer science portal for full stack development goals.
                        </p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <img src="gbstech-icon.png" alt="img-3" class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">
                            Card Title-3
                        </h5>
                        <p class="card-text">
                            add your data ...
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
