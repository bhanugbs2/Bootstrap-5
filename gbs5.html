<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/css/bootstrap.min.css" crossorigin="anonymous">
</head>
<body class="m-2">
    <h1 class="text-success">
        GBS TECH
    </h1>
    <h3>
        BootStrap 5 Layout Grid System
    </h3>
    <section class="container">
        <section class="row">
            <section class="col border bg-success">
                GBS column 1
            </section>
            <section class="col border bg-secondary">
                GBS column 2
            </section>
            <section class="col border bg-danger">
                GBS column 3
            </section>
        </section>
        <br>
        <section class="row">
        <section class="col border bg-warning">
                GBS column 1
            </section>
            <section class="col-6 border bg-info">
                GBS column 2
            </section>
            <section class="col border bg-primary">
                GBS column 3
            </section>
        </section>
    </section>
    
</body>
</html>
