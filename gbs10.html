<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" crossorigin="anonymous">
        <title>Bootstrap 5 Layout Utilities</title>
    </head>
    <body>
        <h3>Bootstrap 5 Layout Utilities</h3>
        <br />
        <p>
            <b>normal form of rows</b>
        </p>
        <section>
            <div class="p-2 border">GBS 1</div>
            <div class="p-2 border">GBS 2</div>
            <div class="p-2 border">GBS 3</div>
        </section>
        <br />
        <p><b>when we applied display property in rows </b></p>
        <section class="d-flex">
            <div class="p-2 border">GBS 1</div>
            <div class="p-2 border">GBS 2</div>
            <div class="p-2 border">GBS 3</div>
        </section>
    </body>
</html>
