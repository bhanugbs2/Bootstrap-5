<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Layout </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="text-center">
    <h1 class="mt-5 text-success">
        GBS TECH
    </h1>
    <h4>BootStrap 5 layout Container</h4>
    <div class="container bg-primary p-4 mt-3">
        <nav class="navbar navbar-expand-lg navbar-light bg-light justify-content-center">
            <a class="navbar-brand" href="#">
                This is a navbar inside a div which is a default container
            </a>
        </nav>
    </div>
    <div class="container-fluid bg-secondary p-4 mt-3">
        <nav class="navbar navbar-expand-lg navbar-light bg-light justify-content-center">
            <a class="navbar-brand" href="#">
                This  is a navbar inside a div which is a fluid container,by gbstech
            </a>
        </nav>
    </div>
</body>
</html>
