<!DOCTYPE html>
<html>
    <head>
        <title>Bootstrap 5 select</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        </script>
    </head>
    <body>
        <div class="container text-center">
            <h1 class="text-success">GBS TECH</h1>
            <h2>Bootstrap 5 select</h2>
            <h3>Default select option</h3>
            <select class="form-select" aria-label="GBS select">
                <option>Select an Option</option>
                <option value="GBS1">HTML</option>
                <option value="GBS2">CSS</option>
                <option value="GBS3">JavaScript</option>
                <option value="GBS4">Bootstrap</option>
            </select>
            <br><br>
            <h3>Disabled select option</h3>
            <select class="form-select" aria-label="GBS Disabled select" disabled>
                <option>Select an Option</option>
                <option value="GBS1">HTML</option>
                <option value="GBS2">CSS</option>
                <option value="GBS3">JavaScript</option>
                <option value="GBS4">Bootstrap</option>
            </select>
            <br><br>
            <h3>Small select option</h3>
            <select class="form-select form-select-sm" aria-label="GBS small select">
                <option>Select an Option</option>
                <option value="GBS1">HTML</option>
                <option value="GBS2">CSS</option>
                <option value="GBS3">JavaScript</option>
                <option value="GBS4">Bootstrap</option>
            </select>
            <br><br>
            <h3>Large select option</h3>
            <select class="form-select form-select-lg" aria-label="GBS Large select">
                <option>Select an Option</option>
                <option value="GBS1">HTML</option>
                <option value="GBS2">CSS</option>
                <option value="GBS3">JavaScript</option>
                <option value="GBS4">Bootstrap</option>
            </select>
        </div>
    </body>
</html>
